# What a screen gets when it takes this plugin. MA_HOST and the token's two halves come from the plugin's inputs in Tessera;
# MA_ROOMS is the rooms the dashboard shows, in order, with commas (empty: every player).
defaults:
  MA_HOST: ""
  MA_TOKEN: ""
  MA_TOKEN_2: ""
  MA_ROOMS: ""

music_assistant:
  id: tm_music_assistant
  host: ${MA_HOST}
  token: "${MA_TOKEN}${MA_TOKEN_2}"
  players: "${MA_ROOMS}"

# The espcontrol MA dashboard's fonts (ma_dashboard.yaml): Outfit only, and the MDI icons it draws. The three small
# sizes are 4 px larger than the panel's (14/17/20 -> 18/21/24): on the 4-inch glass they were under 2 mm.
